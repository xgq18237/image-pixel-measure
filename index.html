<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>图片像素测距工具</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500&family=Noto+Serif+SC:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" crossorigin href="./assets/styles-CJVQJ7kI.css">
  </head>
  <body data-theme="light">
    <div class="app">
      <header class="toolbar">
        <div class="brand">
          <span>图片像素测距</span>
        </div>

        <div class="page-switch" aria-label="页面">
          <button id="measurePageButton" class="page-switch-btn active" type="button" aria-pressed="true">测量</button>
          <a id="landPageButton" class="page-switch-btn" href="./land.html" aria-pressed="false">圈地</a>
        </div>

        <div class="tool-group">
          <button id="fitButton" class="icon-btn" type="button" aria-label="适应窗口" title="适应窗口" data-tooltip="适应窗口">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7" />
            </svg>
          </button>
          <button id="actualButton" class="ratio-btn" type="button" aria-label="原始尺寸" title="原始尺寸" data-tooltip="原始尺寸">1:1</button>
          <button id="zoomOutButton" class="icon-btn" type="button" aria-label="缩小" title="缩小" data-tooltip="缩小">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 12h14" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.8" />
            </svg>
          </button>
          <output id="zoomLabel">100%</output>
          <button id="zoomInButton" class="icon-btn" type="button" aria-label="放大" title="放大" data-tooltip="放大">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.8" />
            </svg>
          </button>
          <button id="boxSelectButton" class="icon-btn" type="button" aria-label="框选" aria-pressed="false" title="框选" data-tooltip="框选">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 7.5A2.5 2.5 0 0 1 7.5 5h9A2.5 2.5 0 0 1 19 7.5v9a2.5 2.5 0 0 1-2.5 2.5h-9A2.5 2.5 0 0 1 5 16.5v-9Z" fill="none" stroke="currentColor" stroke-dasharray="3 2.4" stroke-linecap="round" stroke-width="1.7" />
            </svg>
          </button>
        </div>

        <div class="tool-group data-actions">
          <button id="exportButton" class="icon-text-btn" type="button" hidden title="导出 JSON" data-tooltip="导出 JSON">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3v11m0 0 4-4m-4 4-4-4M5 17.5V19a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-1.5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7" />
            </svg>
            <span>JSON</span>
          </button>
          <button id="clearCacheButton" class="icon-btn" type="button" hidden aria-label="清空缓存" title="清空缓存" data-tooltip="清空缓存">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9 4h6m-8.5 4h11M10 11v6m4-6v6M8 8l.7 11A2.2 2.2 0 0 0 10.9 21h2.2a2.2 2.2 0 0 0 2.2-2L16 8" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7" />
            </svg>
          </button>
        </div>

        <div class="export-settings" aria-label="导出参数">
          <label>
            横格
            <input id="horizontalGridInput" type="text" inputmode="decimal" value="1" />
          </label>
          <label>
            纵格
            <input id="verticalGridInput" type="text" inputmode="decimal" value="1" />
          </label>
          <label>
            实际高
            <input id="physicalHeightInput" type="text" inputmode="decimal" placeholder="可空" />
          </label>
        </div>

        <div class="color-results">
          <div class="color-field" id="averageColorPanel" title="点击字段可复制">
            <span id="averageColorSwatch" class="color-swatch">
              <input id="averageColorPicker" class="swatch-picker" type="color" aria-label="选择平均色" />
            </span>
            <input id="averageColorField" type="text" readonly value="平均色：未计算" aria-label="平均色" />
          </div>

          <div class="color-field" id="dominantColorPanel" title="点击字段可复制">
            <span id="dominantColorSwatch" class="color-swatch">
              <input id="dominantColorPicker" class="swatch-picker" type="color" aria-label="选择主导色系" />
            </span>
            <input id="dominantColorField" type="text" readonly value="主导色系：未计算" aria-label="主导色系" />
          </div>
        </div>

        <div class="picked-color-field">
          <span id="pickedColorSwatch" class="color-swatch">
            <input id="pickedColorPicker" class="swatch-picker" type="color" aria-label="选择点击颜色" />
          </span>
          <input id="pickedColorField" type="text" readonly value="点击颜色：未选择" aria-label="当前点击颜色" />
        </div>

        <div class="readout" id="readout">未选择图片</div>

        <div class="source-actions">
          <div class="settings-menu">
            <button id="settingsButton" class="icon-btn" type="button" aria-label="设置" aria-haspopup="true" aria-expanded="false" title="设置" data-tooltip="设置">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 15.25A3.25 3.25 0 1 0 12 8.75a3.25 3.25 0 0 0 0 6.5Z" fill="none" stroke="currentColor" stroke-width="1.7" />
                <path d="M19.2 13.2c.06-.39.1-.79.1-1.2s-.04-.81-.1-1.2l2-1.55-1.9-3.29-2.35.95a7.7 7.7 0 0 0-2.08-1.2L14.5 3h-5l-.37 2.71a7.7 7.7 0 0 0-2.08 1.2L4.7 5.96 2.8 9.25l2 1.55c-.06.39-.1.79-.1 1.2s.04.81.1 1.2l-2 1.55 1.9 3.29 2.35-.95c.63.51 1.33.92 2.08 1.2L9.5 21h5l.37-2.71a7.7 7.7 0 0 0 2.08-1.2l2.35.95 1.9-3.29-2-1.55Z" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-width="1.7" />
              </svg>
            </button>
            <div id="settingsMenu" class="settings-menu-panel" hidden>
              <label class="settings-menu-item">
                <input id="measureModeToggle" type="checkbox" checked />
                <span>测距模式</span>
              </label>
              <label class="settings-menu-item">
                <input id="colorModeToggle" type="checkbox" checked />
                <span>取色模式</span>
              </label>
            </div>
          </div>

          <button id="themeToggle" class="icon-btn" type="button" aria-label="切换黑白模式" title="切换黑白模式" data-tooltip="切换黑白模式">
            <svg class="theme-icon theme-icon-light" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 17.25A5.25 5.25 0 1 0 12 6.75a5.25 5.25 0 0 0 0 10.5ZM12 2.75v1.5M12 19.75v1.5M4.42 4.42l1.06 1.06M18.52 18.52l1.06 1.06M2.75 12h1.5M19.75 12h1.5M4.42 19.58l1.06-1.06M18.52 5.48l1.06-1.06" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.7" />
            </svg>
            <svg class="theme-icon theme-icon-dark" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M14.75 3.5A7.75 7.75 0 1 0 20.5 9.25 6.15 6.15 0 0 1 14.75 3.5Z" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-width="1.7" />
            </svg>
          </button>

          <div class="source-menu">
            <button id="sourceMenuButton" class="source-button" type="button" aria-haspopup="true" aria-expanded="false" title="打开图片" data-tooltip="打开图片">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5.5 19h13A2.5 2.5 0 0 0 21 16.5v-9A2.5 2.5 0 0 0 18.5 5h-13A2.5 2.5 0 0 0 3 7.5v9A2.5 2.5 0 0 0 5.5 19Z" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-width="1.7" />
                <path d="m4 15 3.2-3.2a1.2 1.2 0 0 1 1.7 0l2.1 2.1 3.1-3.1a1.2 1.2 0 0 1 1.7 0L20 14" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7" />
              </svg>
              <span>打开图片</span>
            </button>
            <div id="sourceMenu" class="source-menu-panel" hidden>
              <input id="imageInput" class="source-input" type="file" multiple accept="image/*" />
              <input id="folderInput" class="source-input" type="file" webkitdirectory multiple accept="image/*" />
              <button id="openImagesButton" class="source-menu-item" type="button">
                <span>选择图片</span>
              </button>
              <button id="openFolderButton" class="source-menu-item" type="button">
                <span>选择文件夹</span>
              </button>
            </div>
          </div>
        </div>
      </header>

      <main class="workspace">
        <section class="viewer-panel">
          <div class="corner-cell"></div>
          <canvas id="topRuler" class="top-ruler"></canvas>
          <canvas id="leftRuler" class="left-ruler"></canvas>
          <div class="canvas-wrap" id="canvasWrap">
            <canvas id="imageCanvas"></canvas>
            <div class="loupe" id="loupe" aria-hidden="true">
              <canvas id="loupeCanvas" width="168" height="168"></canvas>
              <div class="loupe-label" id="loupeLabel">x 0, y 0</div>
            </div>
            <div class="empty-state" id="emptyState">
              <strong>选择或拖拽图片</strong>
              <span>支持单张、多张、文件夹，以及 JPG、PNG、GIF、WebP、BMP、SVG 等格式</span>
            </div>
          </div>
        </section>

        <div
          id="sidebarResizer"
          class="sidebar-resizer"
          role="separator"
          aria-label="调整右侧图片栏宽度"
          aria-orientation="vertical"
          tabindex="0"
        ></div>

        <aside class="sidebar">
          <div class="sidebar-head">
            <div class="sidebar-tabs" role="tablist" aria-label="侧栏视图">
              <button id="filesTabButton" class="sidebar-tab active" type="button" aria-pressed="true">文件</button>
              <button id="dataTabButton" class="sidebar-tab" type="button" aria-pressed="false">数据</button>
            </div>
            <div class="sidebar-head-actions">
              <span id="imageCount">0</span>
              <button id="sidebarCollapseButton" class="icon-btn sidebar-collapse-btn" type="button" aria-label="收起侧栏" title="收起侧栏" data-tooltip="收起侧栏">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="m15 6-6 6 6 6" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" />
                </svg>
              </button>
            </div>
          </div>
          <div id="thumbList" class="thumb-list"></div>
          <div id="dataPanel" class="measure-data-panel" hidden>
            <div class="measure-data-actions">
              <button id="copyDataButton" class="icon-text-btn" type="button" disabled title="复制当前数据" data-tooltip="复制当前数据">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M9 9.5A2.5 2.5 0 0 1 11.5 7h5A2.5 2.5 0 0 1 19 9.5v7a2.5 2.5 0 0 1-2.5 2.5h-5A2.5 2.5 0 0 1 9 16.5v-7Z" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-width="1.7" />
                  <path d="M6.5 15H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h5a2 2 0 0 1 2 2v.5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7" />
                </svg>
                <span>复制</span>
              </button>
              <button id="applyDataButton" class="icon-text-btn" type="button" disabled title="应用数据" data-tooltip="应用数据">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="m5 12 4 4L19 6" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" />
                </svg>
                <span>应用</span>
              </button>
            </div>
            <textarea id="dataEditor" class="measure-data-editor" spellcheck="false" placeholder="选择图片后显示当前数据"></textarea>
          </div>
        </aside>
        <button id="sidebarExpandButton" class="sidebar-expand-btn" type="button" aria-label="展开侧栏" title="展开侧栏" data-tooltip="展开侧栏" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m9 6 6 6-6 6" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" />
          </svg>
        </button>
      </main>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
